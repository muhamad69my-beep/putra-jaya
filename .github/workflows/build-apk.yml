name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap JDK and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Check Bubblewrap configuration
        run: bubblewrap doctor

      - name: Generate temporary signing password
        run: echo "BUBBLEWRAP_KEY_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Init project
        run: |
          rm -rf app-build
          expect -c '
          set timeout 900
          spawn bubblewrap init --manifest="https://muhamad69my-beep.github.io/putra-jaya/manifest.json" --directory="app-build"
          expect {
            -re "Do you want Bubblewrap to install the JDK" { send "n\r"; exp_continue }
            -re "Do you want Bubblewrap to install the Android SDK" { send "n\r"; exp_continue }
            -re {\(Y/n\)} { send "\r"; exp_continue }
            -re {\(y/N\)} { send "y\r"; exp_continue }
            -re "Application name" { send "\r"; exp_continue }
            -re "Short name" { send "\r"; exp_continue }
            -re "Package ID" { send "\r"; exp_continue }
            -re "Full name" { send "PUTRAJAYA\r"; exp_continue }
            -re "Organization" { send "PUTRAJAYA\r"; exp_continue }
            -re "Country code" { send "ID\r"; exp_continue }
            -re "Password" { send "$env(BUBBLEWRAP_KEY_PASSWORD)\r"; exp_continue }
            -re "Confirm" { send "$env(BUBBLEWRAP_KEY_PASSWORD)\r"; exp_continue }
            eof
          }'

      - name: Build APK
        working-directory: app-build
        run: |
          expect -c '
          set timeout 900
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re "Do you want Bubblewrap to install the JDK" { send "n\r"; exp_continue }
            -re "Do you want Bubblewrap to install the Android SDK" { send "n\r"; exp_continue }
            -re {\(Y/n\)} { send "\r"; exp_continue }
            -re {\(y/N\)} { send "y\r"; exp_continue }
            -re "Password" { send "$env(BUBBLEWRAP_KEY_PASSWORD)\r"; exp_continue }
            -re "Confirm" { send "$env(BUBBLEWRAP_KEY_PASSWORD)\r"; exp_continue }
            eof
          }'

      - name: Cari APK
        run: find . -type f -iname "*.apk" -print

      - name: Siapkan APK
        run: |
          APK=$(find . -type f -iname "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK TIDAK DITEMUKAN"
            exit 1
          fi
          mkdir -p apk-output
          cp "$APK" apk-output/putra-jaya.apk
          ls -lh apk-output/putra-jaya.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: putra-jaya-apk
          path: apk-output/putra-jaya.apk
          if-no-files-found: error
