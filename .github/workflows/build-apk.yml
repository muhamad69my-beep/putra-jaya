name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
      - name: Init project
        run: |
          printf 'n\n' | bubblewrap init --manifest="https://muhamad69my-beep.github.io/putra-jaya/manifest.json" --directory=app-build
      - name: Build APK
        run: |
          cd app-build
          bubblewrap build --skipPwaValidation
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: putra-jaya-apk
          path: app-build/app-release-signed.apk
