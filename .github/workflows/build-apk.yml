name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'manifest.json'
      - 'sw.js'
      - 'index.html'
      - 'icon.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'splash.png'

permissions:
  contents: write

concurrency:
  group: putra-jaya-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon.png icon-192.png icon-512.png www/
          test -s www/index.html
          test -s www/manifest.json

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare icon and splash source
        shell: bash
        run: |
          mkdir -p resources
          cp icon-512.png resources/icon.png
          cp splash.png resources/splash.png
          cp splash.png resources/splash-dark.png

      - name: Install capacitor-assets
        run: npm install @capacitor/assets --save-dev

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Make splash full-screen (crop to fill, no borders)
        shell: bash
        run: |
          pip install --quiet pillow
          python3 << 'EOF'
          import glob
          from PIL import Image, ImageOps

          source = Image.open("splash.png").convert("RGB")

          targets = glob.glob("android/app/src/main/res/drawable*/splash.png")
          for path in targets:
              w, h = Image.open(path).size
              fitted = ImageOps.fit(source, (w, h), Image.LANCZOS, centering=(0.5, 0.5))
              fitted.save(path)
              print(f"{path}: {w}x{h} filled")
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        if: always()
        shell: bash
        run: find android/app/build/outputs -type f -iname '*.apk' -print 2>/dev/null || true

      - name: Prepare APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/putra-jaya.apk
          ls -lh apk-output/putra-jaya.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: putra-jaya-apk
          path: apk-output/putra-jaya.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: PUTRAJAYA APK ${{ github.run_number }}
          body: |
            APK PUTRAJAYA hasil build otomatis menggunakan Capacitor.
          files: apk-output/putra-jaya.apk
          fail_on_unmatched_files: true
