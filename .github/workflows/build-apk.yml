name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Initialize Bubblewrap
        run: |
          rm -rf app-build

          bubblewrap init \
            --manifest="https://muhamad69my-beep.github.io/putra-jaya/manifest.json" \
            --directory="app-build" \
            --skipPwaValidation

      - name: Build APK
        working-directory: app-build
        run: |
          bubblewrap build --skipPwaValidation

      - name: Find APK
        run: |
          echo "================================"
          echo "MENCARI FILE APK"
          echo "================================"

          find . -type f -name "*.apk" -print

          echo "================================"
          echo "ISI FOLDER app-build"
          echo "================================"

          find . -maxdepth 4 -type f -print

      - name: Prepare APK
        run: |
          APK=$(find app-build -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK TIDAK DITEMUKAN!"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/putra-jaya.apk

          ls -lh apk-output/putra-jaya.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: putra-jaya-apk
          path: apk-output/putra-jaya.apk
          if-no-files-found: error
