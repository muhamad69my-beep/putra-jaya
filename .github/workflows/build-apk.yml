name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y expect
          npm install -g @bubblewrap/cli
      - name: Init project
        run: |
          cat > init.exp << 'EOF'
          set timeout 900
          spawn bubblewrap init --manifest="https://muhamad69my-beep.github.io/putra-jaya/manifest.json" --directory=app-build
          expect {
            -re {\(Y/n\)} { send "\r"; exp_continue }
            -re {\(y/N\)} { send "y\r"; exp_continue }
            -re "Application name" { send "\r"; exp_continue }
            -re "Short name" { send "\r"; exp_continue }
            -re "Package ID" { send "\r"; exp_continue }
            -re "Full name" { send "PUTRAJAYA\r"; exp_continue }
            -re "Organization" { send "PUTRAJAYA\r"; exp_continue }
            -re "Country code" { send "ID\r"; exp_continue }
            -re "Password" { send "putrajaya123\r"; exp_continue }
            -re "Confirm" { send "putrajaya123\r"; exp_continue }
            eof
          }
          EOF
          expect init.exp
      - name: Build APK
        run: |
          cd app-build
          cat > build.exp << 'EOF'
          set timeout 900
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re {\(Y/n\)} { send "\r"; exp_continue }
            -re {\(y/N\)} { send "y\r"; exp_continue }
            -re "Password" { send "putrajaya123\r"; exp_continue }
            -re "Confirm" { send "putrajaya123\r"; exp_continue }
            eof
          }
          EOF
          expect build.exp
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: putra-jaya-apk
          path: app-build/app-release-signed.apk
